<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Wishlist</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .draggable { cursor: move; }
        .item-card { margin: 10px 0; }
        .drag-handle { cursor: move; padding: 5px; }
    </style>
</head>
<body>
    {% csrf_token %}
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Minha Wishlist</h1>
            <div class="btn-group">
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addItemModal">
                    <i class="fas fa-plus"></i> Novo Item
                </button>
                <button class="btn btn-outline-primary dropdown-toggle" data-bs-toggle="dropdown">
                    Ordenar por
                </button>
                <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="?order_by=nome">Nome</a></li>
                    <li><a class="dropdown-item" href="?order_by=preco">Preço</a></li>
                    <li><a class="dropdown-item" href="?order_by=ordem_personalizada">Personalizado</a></li>
                </ul>
                <button class="btn btn-outline-primary dropdown-toggle" data-bs-toggle="dropdown">
                    Exportar
                </button>
                <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="{% url 'export_markdown' %}">Markdown</a></li>
                    <li><a class="dropdown-item" href="{% url 'export_excel' %}">Excel</a></li>
                </ul>
            </div>
        </div>

        <div id="wishlist-items" class="row">
            {% for item in items %}
            <div class="col-md-6 col-lg-4 item-card" data-id="{{ item.id }}">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span class="drag-handle"><i class="fas fa-grip-vertical"></i></span>
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" {% if item.status == 'comprado' %}checked{% endif %}
                                onchange="updateStatus({{ item.id }}, this.checked)">
                        </div>
                    </div>
                    <div class="card-body">
                        <h5 class="card-title">{{ item.nome }}</h5>
                        <p class="card-text">{{ item.descricao }}</p>
                        <p class="card-text">
                            <strong>Preço:</strong> R$ {{ item.preco }}<br>
                            <strong>Loja:</strong> {{ item.loja }}<br>
                            <a href="{{ item.link }}" target="_blank" class="btn btn-sm btn-outline-primary">
                                <i class="fas fa-external-link-alt"></i> Ver item
                            </a>
                        </p>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <!-- Modal para adicionar item -->
    <div class="modal fade" id="addItemModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Adicionar Novo Item</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addItemForm">
                        <div class="mb-3">
                            <label class="form-label">Nome</label>
                            <input type="text" class="form-control" name="nome" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Descrição</label>
                            <textarea class="form-control" name="descricao"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Preço</label>
                            <input type="number" step="0.01" class="form-control" name="preco" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Link</label>
                            <input type="url" class="form-control" name="link" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Loja</label>
                            <input type="text" class="form-control" name="loja">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="submitForm()">Adicionar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.14.0/Sortable.min.js"></script>
    <script>
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        const csrftoken = getCookie('csrftoken');

        function handleError(response) {
            if (!response.ok) {
                return response.json().then(err => {
                    throw new Error(err.message || 'Ocorreu um erro ao processar sua solicitação');
                });
            }
            return response.json();
        }

        function submitForm() {
            const form = document.getElementById('addItemForm');
            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());

            fetch('/item/add/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrftoken
                },
                body: JSON.stringify(data)
            })
            .then(handleError)
            .then(data => {
                if (data.status === 'success') {
                    location.reload();
                }
            })
            .catch(error => {
                alert(error.message);
            });
        }

        // Configuração do Sortable para drag and drop
        new Sortable(document.getElementById('wishlist-items'), {
            animation: 150,
            handle: '.drag-handle',
            onEnd: function(evt) {
                const items = document.querySelectorAll('.item-card');
                const orderData = {};
                items.forEach((item, index) => {
                    orderData[item.dataset.id] = index;
                });
                
                fetch('/item/update-order/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrftoken
                    },
                    body: JSON.stringify(orderData)
                })
                .then(handleError)
                .catch(error => {
                    alert(error.message);
                });
            }
        });

        function updateStatus(itemId, checked) {
            const status = checked ? 'comprado' : 'pendente';
            
            fetch(`/item/${itemId}/status/`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrftoken
                },
                body: JSON.stringify({ status: status })
            })
            .then(handleError)
            .catch(error => {
                alert(error.message);
            });
        }
    </script>
</body>
</html>
